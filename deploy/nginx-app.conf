# ListSnap behind Nginx. Installed by DEPLOY.md to /etc/nginx/sites-available/listsnap;
# certbot adds the HTTPS lines to it.

server {
    listen 80;
    listen [::]:80;
    server_name getlistsnap.com www.getlistsnap.com;

    # photos are shrunk in the browser, but a bulk upload sends several at once
    client_max_body_size 30m;

    # a chat message can render a reel (~50 s, queued one at a time) plus model calls
    location ~ ^/api/listings/[^/]+/(chat|reel/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # AUTH_IP_HEADER=x-real-ip: set here from the real connection, so a visitor can't fake it
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a studio photo takes up to ~35 s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
