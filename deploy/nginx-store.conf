# The demo WooCommerce store. Installed by DEPLOY.md to /etc/nginx/sites-available/store;
# certbot adds the HTTPS lines to it.

server {
    listen 80;
    listen [::]:80;
    server_name store.getlistsnap.com;

    root /var/www/store;
    index index.php;
    client_max_body_size 30m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # the store downloads product photos from the app while saving a draft
        fastcgi_read_timeout 120s;
    }

    location = /xmlrpc.php { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
