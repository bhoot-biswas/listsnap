name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: listsnap
          MARIADB_USER: listsnap
          MARIADB_PASSWORD: listsnap
          MARIADB_ROOT_PASSWORD: listsnap-root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://listsnap:listsnap@127.0.0.1:3307/listsnap
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      CREDENTIALS_KEY: Y2ktb25seS1jcmVkZW50aWFscy1rZXktMzItYnl0ZXM=
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # voice notes and videos are converted with ffmpeg, and the video test makes its clip with it
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # each step reports even if an earlier one failed, so one run shows every problem
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check
      # a known high or critical hole in a package the app runs fails the check, so the next
      # advisory like the Next.js and undici ones doesn't sit unnoticed in production
      - name: Audit
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high
      - name: Migrate
        if: ${{ !cancelled() }}
        run: node scripts/db-migrate.mjs
      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test:coverage
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build
      # the seller's main path in a phone-sized browser, every outside service mocked
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium && pnpm e2e
      - name: Smoke test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
