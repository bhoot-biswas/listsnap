# Packages whose install scripts we skip. All of them ship prebuilt binaries as
# optional dependencies, so the scripts only re-check or rebuild what is already there.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - hyperframes@0.8.217
